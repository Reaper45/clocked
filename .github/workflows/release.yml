name: Release

# Builds the macOS saver and the Windows .scr and attaches them to a GitHub release.
# A pushed v* tag releases that tag; running it by hand releases the latest v* tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build jobs run the tagged code, so they only get read access; the release job gets write
permissions:
  contents: read

jobs:
  tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          if [ -z "$tag" ]; then
            echo "::error::No v* tag to release. Push one first, e.g. git tag v0.1.0 && git push origin v0.1.0"
            exit 1
          fi
          # Both builds use this commit, even if the tag is moved while they run
          sha=$(git rev-parse "$tag^{commit}")
          echo "Releasing $tag ($sha)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS saver
    needs: tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sh saver/build.sh
      - name: Zip the saver
        run: ditto -c -k --keepParent saver/build/Clocked.saver Clocked-macOS.saver.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Clocked-macOS.saver.zip
          if-no-files-found: error

  windows:
    name: Windows .scr
    needs: tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Only the .exe is needed: Windows runs any .exe renamed to .scr as a screen saver
      - run: pnpm tauri build --no-bundle
      - name: Rename to .scr
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No .exe found in src-tauri/target/release" }
          Copy-Item $exe.FullName Clocked.scr
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Clocked.scr
          if-no-files-found: error

  release:
    name: Attach to release
    needs: [tag, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Runs for the same tag (a tag push and a manual run, or a rerun) wait for each other
    concurrency:
      group: release-${{ needs.tag.outputs.tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
      SHA: ${{ needs.tag.outputs.sha }}
    steps:
      # If the tag was moved after this run built it, the files would not match the release, and an
      # older run could overwrite a newer one's files. Stop and leave it to the run for the new commit.
      - name: Check the tag still points at the built commit
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$current" != "$SHA" ]; then
            echo "::error::$TAG moved from $SHA to $current while this run was building; not releasing"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # A new release starts as a draft and is only published once every file is attached,
      # so a failed upload never leaves a public release with missing downloads
      - name: Create the release if needed and upload
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Clocked $TAG" --generate-notes
          fi
          gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
